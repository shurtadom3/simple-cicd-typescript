<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator CI/CD</title>
</head>

<body>

  <h1>Calculator</h1>

  <input type="number" id="num1" placeholder="First number">

  <select id="operation">
    <option value="sum">+</option>
    <option value="subtract">−</option>
    <option value="multiply">×</option>
    <option value="divide">÷</option>
  </select>

  <input type="number" id="num2" placeholder="Second number">

  <button type="button" id="btnCalculate">
    Calculate
  </button>

  <p>
    Result:
    <strong id="result">—</strong>
  </p>

  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>

  <script>
    document
      .getElementById('btnCalculate')
      .addEventListener('click', function () {

        var a = Number(document.getElementById('num1').value) || 0;
        var b = Number(document.getElementById('num2').value) || 0;
        var operation = document.getElementById('operation').value;

        var result;

        try {

          switch (operation) {

            case "sum":
              result = sum(a, b);
              break;

            case "subtract":
              result = subtract(a, b);
              break;

            case "multiply":
              result = multiply(a, b);
              break;

            case "divide":
              result = divide(a, b);
              break;

          }

        } catch (error) {

          result = error.message;

        }

        document.getElementById('result').textContent = result;

      });
  </script>

</body>

</html>
